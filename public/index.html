<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="header">
        <div>
          <h1>Attendance</h1>
        </div>
        <div class="header-actions">
          <button type="button" id="syncUsersBtn" class="btn">Sync names</button>
          <button type="button" id="refreshBtn" class="btn">Refresh</button>
          <button type="button" id="exportBtn" class="btn btn-primary">Export CSV</button>
        </div>
      </header>

      <form id="filters" class="filters">
        <label>
          From
          <input type="date" id="from" name="from" />
        </label>
        <label>
          To
          <input type="date" id="to" name="to" />
        </label>
        <label>
          User ID
          <input type="text" id="pin" name="pin" placeholder="e.g. 1001" />
        </label>
        <label>
          Device SN
          <input type="text" id="sn" name="sn" placeholder="optional" />
        </label>
        <button type="submit" class="btn">Apply</button>
        <button type="button" id="latestBtn" class="btn">Latest day</button>
        <button type="button" id="clearBtn" class="btn">Clear filters</button>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>User ID</th>
              <th>Name</th>
              <th>Check-in</th>
              <th>Check-out</th>
              <th>Punches</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr>
              <td colspan="7">No data yet</td>
            </tr>
          </tbody>
        </table>
        <div class="table-toolbar">
          <label class="page-size">
            Show
            <select id="pageSize">
              <option value="10">10</option>
              <option value="15" selected>15</option>
              <option value="20">20</option>
              <option value="25">25</option>
              <option value="50">50</option>
            </select>
          </label>
          <div class="pager" id="pager">
            <button type="button" id="prevPage" class="btn btn-pager" disabled>Previous</button>
            <span id="pageInfo" class="page-info">—</span>
            <button type="button" id="nextPage" class="btn btn-pager" disabled>Next</button>
          </div>
        </div>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
